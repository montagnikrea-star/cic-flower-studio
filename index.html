<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CIC Flower Ultimate v9.2 — Mobile Export & Unique Bloom</title>
<style>
:root{color-scheme:dark;--bg:#08111a;--panel:#112233;--panel2:#0b1723;--line:#29465d;--text:#edf6ff;--muted:#98aec3;--acc:#58e0cb}
*{box-sizing:border-box}body{margin:0;font:14px/1.42 Segoe UI,system-ui,sans-serif;background:radial-gradient(circle at 82% 10%,#15334b,transparent 30%),radial-gradient(circle at 12% 88%,#0d2437,transparent 26%),var(--bg);color:var(--text)}
.wrap{max-width:1680px;margin:0 auto;padding:16px;display:grid;grid-template-columns:410px 1fr;gap:16px}.panel,.view{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 46px rgba(0,0,0,.28)}.panel{padding:16px;display:flex;flex-direction:column;gap:12px}.view{padding:16px;display:grid;gap:12px}
h1{margin:0 0 4px;font-size:26px}.sub{font-size:12px;color:var(--muted)}.group{border-top:1px solid rgba(255,255,255,.08);padding-top:12px}h2{margin:0 0 8px;font-size:14px;color:#e0fff9}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label{display:flex;justify-content:space-between;gap:8px;margin:8px 0 4px;font-size:12px;color:#d9e6f3}output{color:#85f0df;font-variant-numeric:tabular-nums}input[type=range],select{width:100%}input[type=range]{accent-color:var(--acc)}select{background:#0b1622;color:var(--text);border:1px solid #36536a;border-radius:10px;padding:8px}button{background:#1b3a4e;border:1px solid #4f7085;color:#f7fcff;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}button.primary{background:var(--acc);border-color:var(--acc);color:#042129}button:hover{filter:brightness(1.07)}.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.preview{position:relative;display:grid;place-items:center;min-height:520px;background:#02070d;border:1px solid #274353;border-radius:14px;overflow:hidden}canvas{display:block}#mainCanvas{width:100%;height:auto;max-height:70vh;object-fit:contain}#chartCanvas{width:100%;height:190px;background:#081522;border:1px solid #29495a;border-radius:12px}.status{padding:10px 12px;border:1px solid #29495a;border-radius:12px;background:#081522;color:#d5edf4;font-size:12px;min-height:44px}.tag{position:absolute;left:10px;bottom:10px;background:rgba(8,18,28,.86);border:1px solid #214254;border-radius:8px;padding:6px 10px;font-size:11px;color:#e0fffa}.switch{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#dce7f0}.switch input{accent-color:var(--acc)}@media(max-width:1150px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<section class="panel">
  <div><h1>CIC Flower Ultimate v9.2</h1><div class="sub">Botanical 3D · Mobile Edition</div></div>
  <div class="group">
    <h2>Быстрый режим</h2>
    <div class="grid2">
      <div><label for="preset">Пресет</label><select id="preset"><option value="lotus">Lotus</option><option value="neon">Neon Flower</option><option value="iris">Iris Bloom</option><option value="orchid">Orchid Glow</option><option value="mirror">Mirror Fusion</option><option value="custom">Custom</option></select></div>
      <div><label for="profile">Спектр</label><select id="profile"><option value="comfort">Comfort</option><option value="delta">Delta</option><option value="theta">Theta</option><option value="alpha" selected>Alpha</option><option value="beta">Beta</option><option value="gamma">Gamma</option><option value="archive">CIC Archive</option><option value="custom">Custom</option></select></div>
    </div>
    <div class="btns"><button class="primary" id="autoBtn">AUTO · новый цветок</button><button id="renderBtn">Новый цветок</button></div>
  </div>

  <div class="group">
    <h2>Структура цветка</h2>
    <label for="rings">Венчики <output id="ringsOut"></output></label><input id="rings" type="range" min="2" max="6" step="1" value="4">
    <label for="petals">Лепестки <output id="petalsOut"></output></label><input id="petals" type="range" min="5" max="18" step="1" value="8">
    <label for="petalLength">Длина <output id="petalLengthOut"></output></label><input id="petalLength" type="range" min="0.35" max="1.5" step="0.01" value="0.95">
    <label for="petalWidth">Ширина <output id="petalWidthOut"></output></label><input id="petalWidth" type="range" min="0.25" max="1.3" step="0.01" value="0.72">
    <label for="petalRoundness">Округлость <output id="petalRoundnessOut"></output></label><input id="petalRoundness" type="range" min="0.2" max="1.6" step="0.01" value="0.88">
    <div class="grid2">
      <div><label for="dimensionDepth">Глубина <output id="dimensionDepthOut"></output></label><input id="dimensionDepth" type="range" min="0" max="1" step="0.01" value="0.72"></div>
      <div><label for="lift">Подъём <output id="liftOut"></output></label><input id="lift" type="range" min="0" max="1" step="0.01" value="0.34"></div>
    </div>
    <div class="grid2">
      <div><label for="harmonicA">Гармоника A <output id="harmonicAOut"></output></label><input id="harmonicA" type="range" min="0" max="8" step="0.01" value="1.9"></div>
      <div><label for="harmonicB">Гармоника B <output id="harmonicBOut"></output></label><input id="harmonicB" type="range" min="0" max="8" step="0.01" value="2.7"></div>
    </div>
    <div class="grid2">
      <div><label for="veinDensity">Прожилки <output id="veinDensityOut"></output></label><input id="veinDensity" type="range" min="2" max="20" step="1" value="9"></div>
      <div><label for="spiralPhase">Фаза <output id="spiralPhaseOut"></output></label><input id="spiralPhase" type="range" min="0" max="6.283" step="0.001" value="1.18"></div>
    </div>
  </div>

  <div class="group">
    <h2>Цвет и свет</h2>
    <label for="flowerHue">Цветок <output id="flowerHueOut"></output></label><input id="flowerHue" type="range" min="0" max="360" step="1" value="168">
    <label for="accentHue">Акцент <output id="accentHueOut"></output></label><input id="accentHue" type="range" min="0" max="360" step="1" value="194">
    <label for="bgHue">Фон <output id="bgHueOut"></output></label><input id="bgHue" type="range" min="0" max="360" step="1" value="210">
    <div class="grid2">
      <div><label for="glow">Свечение <output id="glowOut"></output></label><input id="glow" type="range" min="0.1" max="4" step="0.01" value="2.05"></div>
      <div><label for="transparency">Прозрачность <output id="transparencyOut"></output></label><input id="transparency" type="range" min="0.01" max="0.28" step="0.01" value="0.08"></div>
    </div>
  </div>

  <div class="group">
    <h2>Fusion</h2>
    <label for="mirrorBlend">Mirror Layer <output id="mirrorBlendOut"></output></label><input id="mirrorBlend" type="range" min="0" max="1" step="0.01" value="0.07">
    <label for="mirrorScale">Mirror Scale <output id="mirrorScaleOut"></output></label><input id="mirrorScale" type="range" min="0.5" max="3" step="0.01" value="1.18">
    <label for="mirrorTwist">Mirror Twist <output id="mirrorTwistOut"></output></label><input id="mirrorTwist" type="range" min="0" max="8" step="0.01" value="1.8">
    <div class="switch"><input id="enableMirror" type="checkbox" checked><label for="enableMirror" style="margin:0">Включить слой</label></div>
  </div>

  <div class="group">
    <h2>Display</h2>
    <label for="matrixType">Матрица</label><select id="matrixType"><option value="ips">IPS LCD</option><option value="va">VA LCD</option><option value="tn">TN LCD</option><option value="mini">Mini-LED LCD</option><option value="amoled">AMOLED</option><option value="woled">WOLED</option><option value="qdoled">QD-OLED</option></select>
    <div class="grid2">
      <div><label for="displayStrength">Сила <output id="displayStrengthOut"></output></label><input id="displayStrength" type="range" min="0" max="1" step="0.01" value="0.65"></div>
      <div><label for="viewAngle">Угол <output id="viewAngleOut"></output></label><input id="viewAngle" type="range" min="0" max="80" step="1" value="10"></div>
    </div>
    <div class="switch"><input id="applyDisplay" type="checkbox" checked><label for="applyDisplay" style="margin:0">Применить к изображению</label></div>
  </div>

  <div class="group">
    <h2>Advanced</h2>
    <div class="grid2"><div><label for="fMin">Мин <output id="fMinOut"></output></label><input id="fMin" type="range" min="0.08" max="80" step="0.01" value="8"></div><div><label for="fMax">Макс <output id="fMaxOut"></output></label><input id="fMax" type="range" min="0.10" max="100" step="0.01" value="13"></div></div>
    <div class="grid2"><div><label for="scanRate">Scan <output id="scanRateOut"></output></label><input id="scanRate" type="range" min="0.05" max="10" step="0.01" value="0.5"></div><div><label for="beneficialGain">Gain <output id="beneficialGainOut"></output></label><input id="beneficialGain" type="range" min="0" max="2.5" step="0.01" value="1.10"></div></div>
    <div class="grid2"><div><label for="harmfulSuppression">Cut <output id="harmfulSuppressionOut"></output></label><input id="harmfulSuppression" type="range" min="0" max="0.98" step="0.01" value="0.74"></div><div><label for="filterOrder">Order <output id="filterOrderOut"></output></label><input id="filterOrder" type="range" min="1" max="10" step="1" value="5"></div></div>
    <label for="comfortSoftening">Soft <output id="comfortSofteningOut"></output></label><input id="comfortSoftening" type="range" min="0" max="1" step="0.01" value="0.42">
  </div>

  <div class="group">
    <h2>Impedance</h2>
    <div class="grid3"><div><label for="capPf">C <output id="capPfOut"></output></label><input id="capPf" type="range" min="1" max="5000" step="1" value="220"></div><div><label for="esr">ESR <output id="esrOut"></output></label><input id="esr" type="range" min="0.01" max="200" step="0.01" value="90"></div><div><label for="esl">ESL <output id="eslOut"></output></label><input id="esl" type="range" min="0.01" max="100" step="0.01" value="0.01"></div></div>
    <div class="btns"><button id="autoImpBtn">Auto 50–100Ω</button><button id="checkImpBtn">Check</button></div>
  </div>

  <div class="group">
    <h2>Экспорт</h2>
    <div class="btns"><button id="png4kBtn">Скачать 4K</button><button id="pngPhoneBtn">Скачать iPhone</button></div>
    <div class="btns"><button id="openPngBtn">Открыть PNG</button><button id="sharePngBtn">Поделиться PNG</button></div>
    <div class="btns"><button id="jsonBtn">JSON</button><button id="htmlBtn">HTML</button></div>
  </div>
</section>

<section class="view">
  <div class="preview"><canvas id="mainCanvas" width="1206" height="2622"></canvas><div class="tag" id="tag">preview</div></div>
  <canvas id="chartCanvas" width="1200" height="190"></canvas>
  <div class="status" id="status">Готово.</div>
</section>
</div>
<script>
const IDS=['rings','petals','petalLength','petalWidth','petalRoundness','dimensionDepth','lift','harmonicA','harmonicB','veinDensity','spiralPhase','flowerHue','accentHue','bgHue','glow','transparency','mirrorBlend','mirrorScale','mirrorTwist','displayStrength','viewAngle','fMin','fMax','scanRate','beneficialGain','harmfulSuppression','filterOrder','comfortSoftening','capPf','esr','esl'];
const PROFILES={comfort:[6,12],delta:[0.5,4],theta:[4,8],alpha:[8,13],beta:[13,30],gamma:[30,80],archive:[0.08,4.5]};
const MATRIX={ips:{gamma:1.0,sat:1.0,contrast:1.0,reflect:0.05,subpixel:'rgb'},va:{gamma:1.05,sat:1.0,contrast:1.08,reflect:0.05,subpixel:'rgb'},tn:{gamma:1.1,sat:0.94,contrast:0.96,reflect:0.06,subpixel:'rgb'},mini:{gamma:1.0,sat:1.02,contrast:1.12,reflect:0.04,subpixel:'rgb'},amoled:{gamma:0.97,sat:1.08,contrast:1.18,reflect:0.03,subpixel:'rgb'},woled:{gamma:0.98,sat:0.98,contrast:1.12,reflect:0.03,subpixel:'wrgb'},qdoled:{gamma:0.96,sat:1.12,contrast:1.18,reflect:0.03,subpixel:'tri'}};
const PRESETS={lotus:{rings:4,petals:8,petalLength:0.98,petalWidth:0.76,petalRoundness:0.90,dimensionDepth:0.72,lift:0.34,harmonicA:1.9,harmonicB:2.7,veinDensity:9,spiralPhase:1.18,flowerHue:168,accentHue:194,bgHue:210,glow:2.05,transparency:0.08,mirrorBlend:0.07,mirrorScale:1.18,mirrorTwist:1.8},neon:{rings:4,petals:7,petalLength:1.02,petalWidth:0.70,petalRoundness:0.82,dimensionDepth:0.66,lift:0.28,harmonicA:2.2,harmonicB:3.2,veinDensity:10,spiralPhase:1.42,flowerHue:176,accentHue:200,bgHue:214,glow:2.25,transparency:0.07,mirrorBlend:0.20,mirrorScale:1.25,mirrorTwist:2.2},iris:{rings:3,petals:6,petalLength:1.10,petalWidth:0.62,petalRoundness:0.68,dimensionDepth:0.70,lift:0.36,harmonicA:1.6,harmonicB:2.1,veinDensity:8,spiralPhase:0.94,flowerHue:160,accentHue:186,bgHue:212,glow:1.95,transparency:0.08,mirrorBlend:0.10,mirrorScale:1.05,mirrorTwist:1.4},orchid:{rings:3,petals:5,petalLength:0.92,petalWidth:0.84,petalRoundness:1.02,dimensionDepth:0.74,lift:0.30,harmonicA:1.5,harmonicB:2.4,veinDensity:9,spiralPhase:1.02,flowerHue:178,accentHue:206,bgHue:218,glow:2.15,transparency:0.09,mirrorBlend:0.14,mirrorScale:1.12,mirrorTwist:1.6},mirror:{rings:4,petals:8,petalLength:0.96,petalWidth:0.72,petalRoundness:0.88,dimensionDepth:0.74,lift:0.32,harmonicA:2.0,harmonicB:2.9,veinDensity:10,spiralPhase:1.28,flowerHue:170,accentHue:194,bgHue:210,glow:2.00,transparency:0.08,mirrorBlend:0.34,mirrorScale:1.40,mirrorTwist:2.8}};
const $=id=>document.getElementById(id); let mainCanvas=$('mainCanvas'),ctx=mainCanvas.getContext('2d',{alpha:false,desynchronized:true}); const chartCanvas=$('chartCanvas'),chartCtx=chartCanvas.getContext('2d',{alpha:false}); let lastReport={};
let flowerSeed = newSeed();
let renderNumber = 0;
let exportedImageUrl = null;
function newSeed(){
  const a=new Uint32Array(1);
  if(window.crypto && crypto.getRandomValues)crypto.getRandomValues(a);
  else a[0]=Math.floor(Math.random()*0xffffffff);
  return (a[0]||1)>>>0;
}
function seededRandom(seed){
  let state=seed>>>0;
  return function(){state=(state+0x6D2B79F5)|0;let t=state;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};
}
function freshFlower(){flowerSeed=newSeed();renderNumber++;render();}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function hsv(h,s,v){let c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return[Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];}
function updateOutputs(){IDS.forEach(id=>{const out=$(id+'Out'); if(out){const v=Number($(id).value); out.textContent=(Math.abs(v)>=10||Number.isInteger(v))?v.toFixed(Number.isInteger(v)?0:2):v.toFixed(2);}});}
function applyPreset(name){if(!PRESETS[name])return; Object.entries(PRESETS[name]).forEach(([k,v])=>{if($(k))$(k).value=v;}); updateOutputs();}
function applyProfile(){const p=$('profile').value; if(p==='custom') return; const q=PROFILES[p]; if(q){$('fMin').value=q[0];$('fMax').value=q[1]; updateOutputs();}}
function params(){const p={preset:$('preset').value,profile:$('profile').value,matrixType:$('matrixType').value,enableMirror:$('enableMirror').checked,applyDisplay:$('applyDisplay').checked}; IDS.forEach(id=>p[id]=Number($(id).value)); if(p.fMax<=p.fMin)p.fMax=p.fMin+0.01; return p;}
function temporalBand(p){const k1=Math.max(0.1,p.fMin/Math.max(0.01,p.scanRate)); const k2=Math.max(k1+0.1,p.fMax/Math.max(0.01,p.scanRate)); return [k1,k2];}
function bandWeight(k,k1,k2,n,g,s,soft){const low=1/Math.sqrt(1+Math.pow(k1/Math.max(k,1e-4),2*n)); const high=1/Math.sqrt(1+Math.pow(Math.max(k,1e-4)/k2,2*n)); const band=low*high; const softPenalty=1/(1+soft*Math.pow(k/Math.max(k2,1),2)); return ((1-s)+s*band*(1+g))*softPenalty;}
function impedanceAt(f,p){const C=p.capPf*1e-12,L=p.esl*1e-9,R=p.esr,w=2*Math.PI*f; return Math.sqrt(R*R+Math.pow(w*L-1/(w*C),2));}
function impedanceReport(p){const f1=Math.max(1e5,p.fMin*1e6*0.2),f2=Math.max(f1*1.01,p.fMax*1e6*4),N=128; let min=1e99,max=0,ok=0; const samples=[]; for(let i=0;i<N;i++){const t=i/(N-1),f=f1*Math.pow(f2/f1,t),z=impedanceAt(f,p); if(z<min)min=z;if(z>max)max=z;if(z>=50&&z<=100)ok++; if(i%16===0)samples.push({f,z});} return {minOhm:+min.toFixed(2),maxOhm:+max.toFixed(2),percent:+(100*ok/N).toFixed(1),samples};}
function drawBackground(w,h,p){const [r,g,b]=hsv(p.bgHue,0.52,0.16); const grad=ctx.createRadialGradient(w*0.5,h*0.46,0,w*0.5,h*0.46,Math.max(w,h)*0.82); grad.addColorStop(0,`rgb(${Math.min(255,r+14)},${Math.min(255,g+18)},${Math.min(255,b+22)})`); grad.addColorStop(0.55,`rgb(${r},${g},${b})`); grad.addColorStop(1,'rgb(2,6,10)'); ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);}
function drawMirrorLayer(w,h,p){if(!p.enableMirror||p.mirrorBlend<=0)return; ctx.save(); ctx.globalCompositeOperation='screen'; ctx.strokeStyle=`rgba(110,245,255,${0.04+p.mirrorBlend*0.10})`; ctx.lineWidth=1.05; const scale=Math.min(w,h)*0.22*p.mirrorScale; for(let s=0;s<20;s++){const t=s/19; ctx.beginPath(); for(let i=0;i<=220;i++){const a=i/220*Math.PI*2; const r=scale*(0.84+0.12*Math.sin(a*2+p.mirrorTwist*t)+0.08*Math.cos(a*3-p.mirrorTwist*(1+t))); const x=w*0.5+Math.cos(a+t*p.mirrorTwist)*r*(1+t*0.26); const y=h*0.54+Math.sin(a-t*p.mirrorTwist)*r*(0.72+t*0.46); if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);} ctx.stroke(); } ctx.restore();}
function petalShape(cx,cy,angle,length,halfWidth,roundness,lift,depth){
  // Each petal is an actual closed botanical contour, expressed in a local radial coordinate system.
  const ux=Math.cos(angle),uy=Math.sin(angle),vx=-uy,vy=ux;
  const startR=length*0.06;
  const bx=cx+ux*startR,by=cy+uy*startR;
  const tx=cx+ux*(length+startR),ty=cy+uy*(length+startR)-lift-depth*0.10;
  const broad=halfWidth*(0.85+0.25*roundness);
  const fx=cx+ux*(startR+length*0.28),fy=cy+uy*(startR+length*0.28);
  const mx=cx+ux*(startR+length*0.68),my=cy+uy*(startR+length*0.68);
  return {bx,by,tx,ty,
    l1x:fx+vx*broad,l1y:fy+vy*broad,
    l2x:mx+vx*broad*0.9,l2y:my+vy*broad*0.9,
    r1x:mx-vx*broad*0.9,r1y:my-vy*broad*0.9,
    r2x:fx-vx*broad,r2y:fy-vy*broad,
    ux,uy,vx,vy,length,halfWidth:broad};
}
function petalPath(shape){
  ctx.beginPath();
  ctx.moveTo(shape.bx,shape.by);
  ctx.bezierCurveTo(shape.l1x,shape.l1y,shape.l2x,shape.l2y,shape.tx,shape.ty);
  ctx.bezierCurveTo(shape.r1x,shape.r1y,shape.r2x,shape.r2y,shape.bx,shape.by);
  ctx.closePath();
}
function strokePetal(shape,main,accent,alpha,blur,lineW,veins,cx,cy,angle,len){
  ctx.save();ctx.globalCompositeOperation='lighter';
  // translucent tissue: makes petals readable even where line filaments overlap
  ctx.fillStyle=`rgba(${main[0]},${main[1]},${main[2]},${clamp(alpha*.26,.008,.06)})`;
  petalPath(shape);ctx.fill();
  ctx.strokeStyle=`rgba(${main[0]},${main[1]},${main[2]},${clamp(alpha*2.9,.16,.62)})`;
  ctx.lineWidth=Math.max(1.1,lineW*1.45);ctx.lineJoin='round';
  ctx.shadowColor=`rgba(${accent[0]},${accent[1]},${accent[2]},.85)`;
  ctx.shadowBlur=Math.min(48,blur*1.25);
  petalPath(shape);ctx.stroke();
  // fine bright filament over the perimeter
  ctx.shadowBlur=Math.min(18,blur*.5);
  ctx.strokeStyle=`rgba(${accent[0]},${accent[1]},${accent[2]},${clamp(alpha*2.4,.12,.42)})`;
  ctx.lineWidth=.65;petalPath(shape);ctx.stroke();
  // central vein follows the long axis
  ctx.strokeStyle=`rgba(230,255,251,${clamp(alpha*1.6,.12,.36)})`;
  ctx.lineWidth=.85;ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(shape.bx,shape.by);
  ctx.quadraticCurveTo((shape.bx+shape.tx)*.5,(shape.by+shape.ty)*.5,shape.tx,shape.ty);
  ctx.stroke();
  // secondary veins start on the center vein and end INSIDE the petal, at bounded fractions
  ctx.strokeStyle=`rgba(${accent[0]},${accent[1]},${accent[2]},${clamp(alpha*.9,.06,.17)})`;
  ctx.lineWidth=.5;ctx.shadowBlur=4;
  for(let i=1;i<=veins;i++){

function renderForExport(width,height){
  const exportCanvas=document.createElement('canvas');
  exportCanvas.width=width;exportCanvas.height=height;
  const exportContext=exportCanvas.getContext('2d',{alpha:false,willReadFrequently:false});
  if(!exportContext)throw new Error('Недоступен графический контекст для PNG');
  const previousCanvas=mainCanvas,previousContext=ctx;
  try{
    mainCanvas=exportCanvas;ctx=exportContext;
    const p=params();
    drawBotanicalFlower(p);
    simulateDisplay(p);
  }finally{

function pngBlob(canvas){
  return new Promise((resolve,reject)=>{
    if(canvas.toBlob){canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('Браузер не смог создать PNG')),'image/png');}
    else try{
      const data=canvas.toDataURL('image/png');
      const raw=atob(data.split(',')[1]);
      const arr=new Uint8Array(raw.length);
      for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
      resolve(new Blob([arr],{type:'image/png'}));
    }catch(e){reject(e);}
  });
}
function temporaryURL(blob){

function downloadBlob(blob,name){
  const url=temporaryURL(blob);

}

    downloadBlob(blob,name);
    $('status').textContent='PNG '+width+'×'+height+' создан. Если загрузка не появилась, нажми «Открыть PNG», затем сохрани изображение в браузере.';
