<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CIC Flower Ultimate v11 — Photonic Unified Pattern</title>
<style>
:root{
  color-scheme:dark;
  --bg:#071019;--bg2:#0b1623;--panel:#102235;--line:#234860;--text:#eef8ff;--muted:#91a9be;
  --acc:#63eed9;--acc2:#7ab8ff;--warn:#ffcf7d;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 Segoe UI,system-ui,sans-serif;color:var(--text);
background:radial-gradient(circle at 85% 12%,#15384f,transparent 28%),radial-gradient(circle at 18% 87%,#102338,transparent 30%),linear-gradient(180deg,#08111a,#060d14 32%,#08111a)}
.wrap{max-width:1700px;margin:0 auto;padding:14px;display:grid;grid-template-columns:430px 1fr;gap:14px}
.panel,.view{background:linear-gradient(180deg,rgba(17,33,51,.97),rgba(9,18,29,.97));border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 44px rgba(0,0,0,.28)}
.panel{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.view{padding:14px;display:grid;gap:12px;min-width:0}
h1{margin:0;font-size:25px}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.group{border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
h2{margin:0 0 8px;font-size:14px;color:#ddfff8}
label{display:flex;justify-content:space-between;gap:8px;margin:7px 0 4px;font-size:12px;color:#d6e8f6}
output{color:#85f1df;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=number], select, textarea{width:100%;background:#0b1724;color:var(--text);border:1px solid #35546d;border-radius:10px;padding:8px}
textarea{min-height:62px;resize:vertical}
button{border:1px solid #486a81;background:#17344a;color:#f8fdff;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}
button.primary{background:var(--acc);color:#062128;border-color:var(--acc)}
button:hover{filter:brightness(1.06)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chk{display:flex;align-items:center;gap:8px;font-size:12px;color:#dce8f1}.chk input{accent-color:var(--acc)}
.preview{position:relative;display:grid;place-items:center;min-height:560px;background:#03070d;border:1px solid #284a5b;border-radius:14px;overflow:hidden}
#mainCanvas{width:100%;height:auto;max-height:72vh;object-fit:contain;display:block}
#chartCanvas,#miniCanvas{width:100%;height:auto;background:#091624;border:1px solid #274859;border-radius:12px;display:block}
#miniCanvas{max-height:160px}
.status{padding:10px 12px;border:1px solid #28495c;border-radius:12px;background:#091521;color:#d8edf4;font-size:12px;min-height:46px}
.badges{display:flex;flex-wrap:wrap;gap:8px}.badge{padding:6px 10px;border:1px solid #28495c;background:#0b1825;border-radius:999px;font-size:11px;color:#d9edf6}
.table{display:grid;grid-template-columns:1.15fr .85fr .85fr .85fr .85fr;gap:6px;font-size:12px}.table div{padding:6px 8px;border:1px solid rgba(255,255,255,.06);border-radius:8px;background:#0b1825;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{position:absolute;left:10px;bottom:10px;background:rgba(8,18,28,.88);border:1px solid #234456;border-radius:8px;padding:6px 10px;font-size:11px;color:#dffef9}
.small{font-size:11px;color:var(--muted)}
hr.sep{border:none;border-top:1px solid rgba(255,255,255,.08);margin:8px 0}
@media(max-width:1180px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<section class="panel">
  <div>
    <h1>CIC Flower Ultimate v11</h1>
    <div class="sub">Photonic Unified Pattern · единый фотонный, спектральный и энергетический цветок</div>
  </div>

  <div class="group">
    <h2>Главный режим</h2>
    <div class="grid2">
      <div>
        <label for="solveMode">Движок</label>
        <select id="solveMode">
          <option value="photonic">Фотонный процессор</option>
          <option value="arith">Частотные камеры · арифметика</option>
          <option value="system">Энергетический баланс · 2×2</option>
          <option value="passive">Пассивный резонанс</option>
        </select>
      </div>
      <div>
        <label for="preset">Спектральный профиль</label>
        <select id="preset">
          <option value="alpha">Alpha Focus</option>
          <option value="theta">Theta Drift</option>
          <option value="beta">Beta Drive</option>
          <option value="broad">Broadband Mixed</option>
          <option value="unknown">Unknown Spectrum</option>
          <option value="custom">Custom</option>
        </select>
      </div>
    </div>
    <div class="btns">
      <button class="primary" id="autoBtn">AUTO</button>
      <button id="newSeedBtn">Новый цветок</button>
    </div>
  </div>

  <div class="group">
    <h2>Вычислительные данные</h2>
    <div id="photonicBox">
      <div class="grid4">
        <div><label>x1</label><input id="px1" type="number" step="0.01" value="1.00"></div>
        <div><label>φ1</label><input id="pp1" type="number" step="1" value="0"></div>
        <div><label>x2</label><input id="px2" type="number" step="0.01" value="0.75"></div>
        <div><label>φ2</label><input id="pp2" type="number" step="1" value="45"></div>
        <div><label>x3</label><input id="px3" type="number" step="0.01" value="0.45"></div>
        <div><label>φ3</label><input id="pp3" type="number" step="1" value="95"></div>
        <div><label>x4</label><input id="px4" type="number" step="0.01" value="0.25"></div>
        <div><label>φ4</label><input id="pp4" type="number" step="1" value="180"></div>
      </div>
    </div>
    <div id="arithBox" style="display:none">
      <div class="grid3">
        <div><label>A</label><input id="arithA" type="number" step="1" value="12"></div>
        <div><label>Операция</label><select id="arithOp"><option>+</option><option>-</option><option>×</option><option>÷</option></select></div>
        <div><label>B</label><input id="arithB" type="number" step="1" value="7"></div>
      </div>
    </div>
    <div id="systemBox" style="display:none">
      <div class="grid3">
        <div><label>a11</label><input id="a11" type="number" step="0.1" value="3"></div>
        <div><label>a12</label><input id="a12" type="number" step="0.1" value="1"></div>
        <div><label>b1</label><input id="b1" type="number" step="0.1" value="7"></div>
        <div><label>a21</label><input id="a21" type="number" step="0.1" value="1"></div>
        <div><label>a22</label><input id="a22" type="number" step="0.1" value="2"></div>
        <div><label>b2</label><input id="b2" type="number" step="0.1" value="5"></div>
      </div>
    </div>
    <div id="passiveBox" style="display:none">
      <div class="grid4">
        <div><label>f1</label><input id="f1" type="number" step="0.1" value="8"></div>
        <div><label>A1</label><input id="fa1" type="number" step="0.01" value="1"></div>
        <div><label>f2</label><input id="f2" type="number" step="0.1" value="10.5"></div>
        <div><label>A2</label><input id="fa2" type="number" step="0.01" value="0.8"></div>
        <div><label>f3</label><input id="f3" type="number" step="0.1" value="14"></div>
        <div><label>A3</label><input id="fa3" type="number" step="0.01" value="0.45"></div>
        <div><label>f4</label><input id="f4" type="number" step="0.1" value="24"></div>
        <div><label>A4</label><input id="fa4" type="number" step="0.01" value="0.20"></div>
      </div>
    </div>
  </div>

  <div class="group">
    <h2>Общие свойства паттерна</h2>
    <label for="petals">Лепестков-резонаторов <output id="petalsOut"></output></label>
    <input id="petals" type="range" min="6" max="18" step="1" value="10">
    <label for="rings">Венчики / глубина <output id="ringsOut"></output></label>
    <input id="rings" type="range" min="2" max="8" step="1" value="5">
    <label for="baseFreq">Базовая частота <output id="baseFreqOut"></output></label>
    <input id="baseFreq" type="range" min="0.5" max="40" step="0.1" value="8.0">
    <label for="spacing">Шаг резонансов <output id="spacingOut"></output></label>
    <input id="spacing" type="range" min="0.2" max="12" step="0.1" value="2.3">
    <label for="qFactor">Q-фактор <output id="qFactorOut"></output></label>
    <input id="qFactor" type="range" min="0.5" max="30" step="0.1" value="8.0">
    <label for="coupling">Связь камер <output id="couplingOut"></output></label>
    <input id="coupling" type="range" min="0" max="1" step="0.01" value="0.25">
    <label for="retention">Удержание энергии <output id="retentionOut"></output></label>
    <input id="retention" type="range" min="0.70" max="0.999" step="0.001" value="0.955">
    <label for="glow">Свечение <output id="glowOut"></output></label>
    <input id="glow" type="range" min="0.2" max="4" step="0.01" value="2.2">
    <label for="mirrorMix">Mirror Fusion <output id="mirrorMixOut"></output></label>
    <input id="mirrorMix" type="range" min="0" max="1" step="0.01" value="0.58">
    <label for="chirality">Хиральность <output id="chiralityOut"></output></label>
    <input id="chirality" type="range" min="-1" max="1" step="0.01" value="0.24">
  </div>

  <div class="group">
    <h2>Фотонный слой и матрица дисплея</h2>
    <div class="grid2">
      <div>
        <label for="matrixProfile">Профиль матрицы</label>
        <select id="matrixProfile">
          <option value="oled">OLED</option>
          <option value="amoled">AMOLED</option>
          <option value="ips">IPS</option>
          <option value="mini">Mini LED</option>
          <option value="va">VA</option>
          <option value="retina">Retina</option>
          <option value="generic">Generic</option>
        </select>
      </div>
      <div>
        <label for="wavelengthBias">Смещение длины волны</label>
        <select id="wavelengthBias">
          <option value="cyan">Cyan</option>
          <option value="emerald">Emerald</option>
          <option value="violet">Violet</option>
          <option value="gold">Gold</option>
          <option value="mix">Mixed</option>
        </select>
      </div>
    </div>
    <label for="refraction">Преломление <output id="refractionOut"></output></label>
    <input id="refraction" type="range" min="0" max="1" step="0.01" value="0.68">
    <label for="interference">Интерференция <output id="interferenceOut"></output></label>
    <input id="interference" type="range" min="0" max="1" step="0.01" value="0.70">
    <label for="diffraction">Дифракционная глубина <output id="diffractionOut"></output></label>
    <input id="diffraction" type="range" min="0" max="1" step="0.01" value="0.54">
    <label for="continuum">Continuum Sync <output id="continuumOut"></output></label>
    <input id="continuum" type="range" min="0" max="1" step="0.01" value="0.62">
    <div class="checks">
      <div class="chk"><input id="fullRest" type="checkbox"><label for="fullRest" style="margin:0">Полный покой после расчёта</label></div>
      <div class="chk"><input id="autoRun" type="checkbox" checked><label for="autoRun" style="margin:0">Автозапуск</label></div>
      <div class="chk"><input id="animate" type="checkbox" checked><label for="animate" style="margin:0">Живая фаза</label></div>
      <div class="chk"><input id="showVeins" type="checkbox" checked><label for="showVeins" style="margin:0">Тонкие прожилки</label></div>
    </div>
    <div class="btns">
      <button class="primary" id="runBtn">Выполнить</button>
      <button id="restBtn">Пауза / Покой</button>
    </div>
  </div>

  <div class="group">
    <h2>Экспорт</h2>
    <div class="btns">
      <button id="pngPhoneBtn">PNG iPhone</button>
      <button id="png4kBtn">PNG 4K</button>
    </div>
    <div class="btns">
      <button id="jsonBtn">JSON</button>
      <button id="htmlBtn">HTML snapshot</button>
    </div>
  </div>
</section>

<section class="view">
  <div class="preview">
    <canvas id="mainCanvas" width="1206" height="2622"></canvas>
    <div class="tag" id="tag">CIC Flower v11</div>
  </div>
  <canvas id="miniCanvas" width="1200" height="150"></canvas>
  <canvas id="chartCanvas" width="1200" height="220"></canvas>
  <div class="badges">
    <div class="badge" id="bMode">Mode —</div>
    <div class="badge" id="bAnswer">Answer —</div>
    <div class="badge" id="bEnergy">Energy —</div>
    <div class="badge" id="bStable">Stability —</div>
    <div class="badge" id="bMirror">Mirror —</div>
  </div>
  <div class="table" id="tableOut"></div>
  <div class="status" id="status">Готово.</div>
</section>
</div>
<script>
const $ = id => document.getElementById(id);
const RANGE_IDS = ['petals','rings','baseFreq','spacing','qFactor','coupling','retention','glow','mirrorMix','chirality','refraction','interference','diffraction','continuum'];
const mainCanvas = $('mainCanvas'), ctx = mainCanvas.getContext('2d',{alpha:false,desynchronized:true});
const chartCanvas = $('chartCanvas'), cctx = chartCanvas.getContext('2d',{alpha:false});
const miniCanvas = $('miniCanvas'), mctx = miniCanvas.getContext('2d',{alpha:false});
const state = {
  uid:'', seed:1, rand:null, petals:[], energies:[], transfer:[], result:null,
  running:false, step:0, maxSteps:180, renderTime:0, frozen:false,
  mode:'photonic', animPhase:0
};
function xmur3(str){for(var i=0,h=1779033703^str.length;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),3432918353),h=h<<13|h>>>19;return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0;}}
function mulberry32(a){return function(){var t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function complex(re,im){return {re,im};}
function cAdd(a,b){return {re:a.re+b.re, im:a.im+b.im};}
function cMul(a,b){return {re:a.re*b.re-a.im*b.im, im:a.re*b.im+a.im*b.re};}
function cScale(a,s){return {re:a.re*s, im:a.im*s};}
function cAbs2(a){return a.re*a.re+a.im*a.im;}
function expi(deg){const r=deg*Math.PI/180; return {re:Math.cos(r), im:Math.sin(r)};}
function uid(){return 'F-'+Math.random().toString(36).slice(2,10);} 
function hsv(h,s,v){let c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];}
function lorentz(f,f0,q){const bw=Math.max(0.01,f0/Math.max(0.1,q)); const x=(f-f0)/bw; return 1/(1+x*x);} 
function matrixProfileValues(name){
  const map={oled:[1.0,1.08,1.18], amoled:[1.05,1.10,1.24], ips:[0.95,0.98,1.02], mini:[1.04,1.02,1.12], va:[1.00,0.96,1.08], retina:[1.02,1.05,1.15], generic:[1,1,1]};
  const [sat,gamma,sharp]=map[name]||map.generic; return {sat,gamma,sharp};
}
function wavelengthBase(kind){ if(kind==='emerald') return 142; if(kind==='violet') return 276; if(kind==='gold') return 45; if(kind==='mix') return 190; return 176; }
function values(){return {
  solveMode:$('solveMode').value, preset:$('preset').value,
  px:[+$('px1').value,+$('px2').value,+$('px3').value,+$('px4').value],
  pp:[+$('pp1').value,+$('pp2').value,+$('pp3').value,+$('pp4').value],
  arithA:+$('arithA').value, arithB:+$('arithB').value, arithOp:$('arithOp').value,
  A:[[+$('a11').value,+$('a12').value],[+$('a21').value,+$('a22').value]], b:[+$('b1').value,+$('b2').value],
  f:[+$('f1').value,+$('f2').value,+$('f3').value,+$('f4').value], fa:[+$('fa1').value,+$('fa2').value,+$('fa3').value,+$('fa4').value],
  petals:+$('petals').value, rings:+$('rings').value, baseFreq:+$('baseFreq').value, spacing:+$('spacing').value,
  qFactor:+$('qFactor').value, coupling:+$('coupling').value, retention:+$('retention').value, glow:+$('glow').value,
  mirrorMix:+$('mirrorMix').value, chirality:+$('chirality').value, refraction:+$('refraction').value,
  interference:+$('interference').value, diffraction:+$('diffraction').value, continuum:+$('continuum').value,
  matrixProfile:$('matrixProfile').value, wavelengthBias:$('wavelengthBias').value,
  fullRest:$('fullRest').checked, autoRun:$('autoRun').checked, animate:$('animate').checked, showVeins:$('showVeins').checked
};}
function updateOutputs(){ RANGE_IDS.forEach(id=>{$(id+'Out').textContent=(+$(id).value).toFixed(id==='petals'||id==='rings'?0:((+$(id).value)>=10?1:3));}); }
function applyPreset(name){
  if(name==='alpha'){ $('baseFreq').value=8; $('spacing').value=2.4; $('qFactor').value=8; $('f1').value=8; $('fa1').value=1; $('f2').value=10.5; $('fa2').value=.8; $('f3').value=14; $('fa3').value=.45; $('f4').value=24; $('fa4').value=.2; }
  else if(name==='theta'){ $('baseFreq').value=4; $('spacing').value=2; $('qFactor').value=7; $('f1').value=4.2; $('fa1').value=1; $('f2').value=6.0; $('fa2').value=.7; $('f3').value=9.5; $('fa3').value=.25; $('f4').value=14; $('fa4').value=.12; }
  else if(name==='beta'){ $('baseFreq').value=12; $('spacing').value=3.2; $('qFactor').value=9; $('f1').value=14; $('fa1').value=1; $('f2').value=18; $('fa2').value=.8; $('f3').value=24; $('fa3').value=.6; $('f4').value=32; $('fa4').value=.25; }
  else if(name==='broad'){ $('baseFreq').value=5; $('spacing').value=3.6; $('qFactor').value=6.8; $('f1').value=3.5; $('fa1').value=.9; $('f2').value=8.5; $('fa2').value=.7; $('f3').value=15; $('fa3').value=.8; $('f4').value=28; $('fa4').value=.55; }
  else if(name==='unknown'){ $('baseFreq').value=6; $('spacing').value=2.9; $('qFactor').value=7.9; $('f1').value=5.3; $('fa1').value=.45; $('f2').value=11.7; $('fa2').value=.92; $('f3').value=17.9; $('fa3').value=.52; $('f4').value=22.8; $('fa4').value=.65; }
  updateOutputs();
}
function refreshModeBoxes(){
  const m = $('solveMode').value;
  $('photonicBox').style.display = (m==='photonic') ? '' : 'none';
  $('arithBox').style.display = (m==='arith') ? '' : 'none';
  $('systemBox').style.display = (m==='system') ? '' : 'none';
  $('passiveBox').style.display = (m==='passive') ? '' : 'none';
}
function newSeed(){ state.uid=uid(); state.seed=xmur3(state.uid+'|'+performance.now().toFixed(4))(); state.rand=mulberry32(state.seed); }
function buildPetals(){
  const p = values(); if(!state.rand) newSeed();
  state.petals = Array.from({length:p.petals}, (_,i)=>{
    const t=i/p.petals, ring=1+(i%p.rings), ang=t*Math.PI*2 + (state.rand()-0.5)*0.06 + p.chirality*0.12*ring;
    return {
      id:i, ring,
      theta:ang,
      f0:Math.max(0.1,p.baseFreq + i*p.spacing*0.55 + (state.rand()-0.5)*p.spacing*0.45),
      q:p.qFactor*(0.84+state.rand()*0.34),
      radius:0.52+0.08*ring+state.rand()*0.08,
      skew:(state.rand()-0.5)*0.30,
      hueShift:(state.rand()-0.5)*18
    };
  });
  state.energies = Array(state.petals.length).fill(0);
  state.transfer = Array.from({length:p.petals},()=>Array(4).fill(complex(0,0)));
  state.step=0; state.result=null; state.frozen=false;
}
function buildTransferMatrix(){
  const p=values();
  state.transfer = state.petals.map((pet, k)=>{
    return Array.from({length:4}, (_,j)=>{
      const base = lorentz(p.baseFreq + j*p.spacing*0.9, pet.f0, pet.q);
      const refr = 1 + p.refraction*0.55*Math.cos((j+1)*1.13 - pet.theta*2 + pet.skew);
      const inter = p.interference*Math.sin((k+1)*(j+1)*0.71 + p.mirrorMix*Math.cos(pet.theta*2));
      const diff = 1 + p.diffraction*0.4*Math.cos((k+1)*0.38 + (j+1)*0.64);
      const amp = Math.max(0, base*refr*diff*(0.68 + 0.22*Math.abs(inter)));
      const phase = pet.theta*180/Math.PI*(1+p.chirality*0.12) + (j+1)*33 + inter*48;
      return cScale(expi(phase), amp);
    });
  });
}
function computePhotonic(){
  const p=values(); buildTransferMatrix();
  const xin = p.px.map((x,i)=>cScale(expi(p.pp[i]), x));
  const out = state.transfer.map((row)=>{
    let acc=complex(0,0); for(let j=0;j<4;j++) acc=cAdd(acc,cMul(row[j], xin[j])); return acc;
  });
  state.energies = out.map(v=>cAbs2(v));
  const sumE = state.energies.reduce((a,b)=>a+b,0);
  const maxE = Math.max(...state.energies), idx = state.energies.indexOf(maxE), second=[...state.energies].sort((a,b)=>b-a)[1]||0;
  const weighted = sumE>0 ? state.energies.reduce((s,e,i)=>s + e*state.petals[i].f0,0)/sumE : 0;
  state.result = { answer:`Выход ${idx+1} · f≈${state.petals[idx].f0.toFixed(2)}`, sumE, stability:maxE?((maxE-second)/maxE):0, mirror:mirrorScore(), weighted, mode:'photonic' };
}
function computePassiveStep(){
  const p=values();
  const inject = state.petals.map((pet,k)=>{
    let s=0; for(let i=0;i<4;i++){ const base=(p.fa[i]*p.fa[i])*lorentz(p.f[i], pet.f0, pet.q); const refr=1+p.refraction*0.65*Math.cos(p.f[i]*0.17-pet.theta*2+pet.skew); s += Math.max(0, base*refr); }
    return s;
  });
  const N=state.petals.length, next=Array(N).fill(0);
  for(let k=0;k<N;k++){
    const left=state.energies[(k-1+N)%N], right=state.energies[(k+1)%N];
    const coupled=p.coupling*0.5*(left+right-2*state.energies[k]);
    const raw=state.energies[k]*p.retention + inject[k] + coupled;
    next[k]=Math.tanh(Math.max(0,raw))*1.5;
  }
  state.energies=next; state.step++;
  const sumE = next.reduce((a,b)=>a+b,0), maxE=Math.max(...next), idx=next.indexOf(maxE), second=[...next].sort((a,b)=>b-a)[1]||0;
  state.result = { answer:`Канал ${idx+1} · f≈${state.petals[idx].f0.toFixed(2)}`, sumE, stability:maxE?((maxE-second)/maxE):0, mirror:mirrorScore(), weighted:0, mode:'passive' };
}
function computeArithmetic(){
  const p=values(); const A=p.arithA, B=p.arithB, op=p.arithOp;
  let text='', val=null, extra='';
  if(op==='+') val=A+B;
  else if(op==='-') val=A-B;
  else if(op==='×') val=A*B;
  else if(op==='÷'){
    if(B===0){ text = (A===0) ? '0/0 · неопределённость' : `${A}/0 · особая точка`; val=null; extra='singularity'; }
    else { val=Math.trunc(A/B); extra=`остаток ${A%B}`; }
  }
  state.energies = state.petals.map((pet,i)=>{
    const base = Math.abs((val ?? (A||1)))/(i+2);
    const wave = Math.abs(Math.sin((i+1)*(A+1)*0.13) + Math.cos((i+1)*(B+1)*0.17));
    return Math.max(0.03, (base*0.08 + wave*0.45)/(1+i*0.03));
  });
  const sumE = state.energies.reduce((a,b)=>a+b,0);
  text = text || `${A} ${op} ${B} = ${val}${extra?(' · '+extra):''}`;
  state.result = { answer:text, sumE, stability:0.72, mirror:mirrorScore(), weighted:0, mode:'arith' };
}
function computeSystem(){
  const p=values(); const [[a,b],[c,d]]=p.A; const [e,f]=p.b; const det=a*d-b*c;
  let answer='';
  if(Math.abs(det)<1e-9){
    const dep1 = Math.abs(a*f-c*e)<1e-8, dep2 = Math.abs(b*f-d*e)<1e-8;
    answer = dep1 && dep2 ? 'Бесконечно много решений' : 'Нет решений';
    state.energies = state.petals.map((pet,i)=>0.18 + 0.12*Math.abs(Math.sin((i+1)*0.73)));
    state.result = { answer, sumE:state.energies.reduce((s,v)=>s+v,0), stability:0.2, mirror:mirrorScore(), weighted:0, mode:'system' };
    return;
  }
  const x=(e*d-b*f)/det, y=(a*f-e*c)/det;
  state.energies = state.petals.map((pet,i)=>{
    const target=(i%2===0?Math.abs(x):Math.abs(y));
    const wave=0.3*Math.abs(Math.sin((i+1)*(x+1)*0.35)+Math.cos((i+1)*(y+1)*0.31));
    return 0.06+target*0.08+wave;
  });
  const residual1=Math.abs(a*x+b*y-e), residual2=Math.abs(c*x+d*y-f);
  state.result = { answer:`x=${x.toFixed(4)}, y=${y.toFixed(4)}`, sumE:state.energies.reduce((s,v)=>s+v,0), stability:1/(1+residual1+residual2), mirror:mirrorScore(), weighted:0, mode:'system' };
}
function mirrorScore(){
  const N=state.energies.length; if(!N) return 0; let same=0,total=0;
  for(let i=0;i<N;i++){ const j=(N-i)%N; const a=state.energies[i]||0,b=state.energies[j]||0; same += 1 - Math.abs(a-b)/(Math.max(1e-6,a,b)); total++; }
  return same/Math.max(1,total);
}
function runSolve(){
  const p=values(); buildPetals(); state.mode=p.solveMode; state.running=true; state.step=0; state.frozen=false;
  if(p.solveMode==='photonic'){ computePhotonic(); state.running=false; }
  else if(p.solveMode==='arith'){ computeArithmetic(); state.running=false; }
  else if(p.solveMode==='system'){ computeSystem(); state.running=false; }
  else { state.running=true; }
  if(p.fullRest && p.solveMode!=='passive') state.frozen=true;
  renderAll();
}
function stopRun(){ state.running=false; state.frozen=true; renderAll(); }
function renderFlower(rctx,w,h,phase){
  const p=values(), prof=matrixProfileValues(p.matrixProfile), baseHue=wavelengthBase(p.wavelengthBias);
  rctx.clearRect(0,0,w,h);
  const bg=rctx.createRadialGradient(w*0.5,h*0.52,0,w*0.5,h*0.56,Math.max(w,h)*0.82);
  bg.addColorStop(0,'rgb(16,37,57)'); bg.addColorStop(.45,'rgb(6,14,22)'); bg.addColorStop(1,'rgb(1,5,9)');
  rctx.fillStyle=bg; rctx.fillRect(0,0,w,h);
  const cx=w*0.5, cy=h*0.60, scale=Math.min(w,h), maxE=Math.max(1e-6,...state.energies,1);
  // back halos / mirror field
  rctx.save(); rctx.globalCompositeOperation='screen';
  for(let ring=0; ring<p.rings+2; ring++){
    const rr=scale*(0.14+ring*0.055), sy=0.76+ring*0.05;
    rctx.beginPath();
    for(let a=0;a<=200;a++){
      const ang=a/200*Math.PI*2;
      const deform=1 + 0.14*Math.cos(ang*2 + ring*0.6 + phase*0.25) + p.mirrorMix*0.08*Math.cos(ang*4);
      const x=cx + Math.cos(ang)*rr*deform;
      const y=cy + Math.sin(ang)*rr*deform*sy;
      if(a===0) rctx.moveTo(x,y); else rctx.lineTo(x,y);
    }
    rctx.strokeStyle=`rgba(120,230,255,${0.016+ring*0.007})`; rctx.lineWidth=1; rctx.shadowBlur=8+p.glow*7; rctx.shadowColor='rgba(120,230,255,.20)'; rctx.stroke();
  }
  rctx.restore();

  for(let layer=p.rings; layer>=1; layer--){
    const layerScale = 0.60 + layer*0.10;
    state.petals.forEach((pet,i)=>{
      if(pet.ring!==layer) return;
      const e=(state.energies[i]||0)/maxE;
      const mirrorPush = p.mirrorMix*Math.sin(pet.theta*2 + phase*0.2)*0.22;
      const angle = -Math.PI/2 + pet.theta + p.chirality*0.18*layer + mirrorPush;
      const swing = p.animate && !state.frozen ? Math.sin(phase*0.65 + i*0.55)*0.03*p.continuum : 0;
      const len = scale*(0.12 + pet.radius*0.10 + layer*0.012 + e*0.05)*layerScale*0.58;
      const wid = scale*(0.025 + 0.02*layer + e*0.01)*0.70;
      const lift = scale*(0.011*layer + 0.003*i);
      const a = angle + swing;
      const baseX = cx, baseY = cy - lift;
      const tipX = baseX + Math.cos(a)*len*0.25;
      const tipY = baseY + Math.sin(a)*len - scale*0.02*layer;
      const lx = baseX + Math.cos(a+Math.PI/2)*wid, ly = baseY + Math.sin(a+Math.PI/2)*wid*0.70;
      const rx = baseX + Math.cos(a-Math.PI/2)*wid, ry = baseY + Math.sin(a-Math.PI/2)*wid*0.70;
      const c1x = lx + Math.cos(a-0.8+pet.skew)*len*0.45, c1y = ly + Math.sin(a-0.8+pet.skew)*len*0.25;
      const c2x = tipX + Math.cos(a+Math.PI/2)*wid*0.40, c2y = tipY + Math.sin(a+Math.PI/2)*wid*0.18;
      const c3x = tipX + Math.cos(a-Math.PI/2)*wid*0.40, c3y = tipY + Math.sin(a-Math.PI/2)*wid*0.18;
      const c4x = rx + Math.cos(a+0.8+pet.skew)*len*0.45, c4y = ry + Math.sin(a+0.8+pet.skew)*len*0.25;
      const hue = (baseHue + pet.hueShift + i*7 + layer*10 + e*20) % 360;
      const sat = clamp(0.48*prof.sat + e*0.26, 0, 1);
      const col = hsv(hue, sat, clamp(0.82 + e*0.30, 0, 1));
      const fill = rctx.createLinearGradient(baseX,baseY,tipX,tipY);
      fill.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${0.04+e*0.11})`);
      fill.addColorStop(.52, `rgba(${col[0]},${col[1]},${col[2]},${0.12+e*0.22})`);
      fill.addColorStop(1, `rgba(255,255,255,${0.02+e*0.04})`);
      rctx.save(); rctx.globalCompositeOperation='lighter';
      rctx.beginPath(); rctx.moveTo(lx,ly); rctx.bezierCurveTo(c1x,c1y,c2x,c2y,tipX,tipY); rctx.bezierCurveTo(c3x,c3y,c4x,c4y,rx,ry); rctx.closePath();
      rctx.fillStyle=fill; rctx.fill();
      rctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},${0.14+e*0.48})`; rctx.lineWidth=0.9+layer*0.22+e*1.6; rctx.shadowBlur=(10+p.glow*7+e*18)*prof.sharp; rctx.shadowColor=`rgba(${col[0]},${col[1]},${col[2]},${0.28+e*0.34})`; rctx.stroke();
      rctx.strokeStyle=`rgba(255,255,255,${0.08+e*0.18})`; rctx.lineWidth=0.5;
      rctx.beginPath(); rctx.moveTo(baseX,baseY); rctx.quadraticCurveTo((baseX+tipX)/2+Math.cos(a+Math.PI/2)*4,(baseY+tipY)/2+Math.sin(a+Math.PI/2)*4,tipX,tipY); rctx.stroke();
      if(p.showVeins){
        for(let v=1; v<=4; v++){
          const tt=v/5, sx=baseX*(1-tt)+lx*tt, sy=baseY*(1-tt)+ly*tt, ex=tipX*(0.9+0.1*tt), ey=tipY*(0.9+0.1*tt);
          rctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},${0.04+e*0.09})`; rctx.lineWidth=0.38;
          rctx.beginPath(); rctx.moveTo(sx,sy); rctx.quadraticCurveTo((sx+ex)/2+Math.cos(a)*(v%2?5:-5),(sy+ey)/2+Math.sin(a)*(v%2?5:-5),ex,ey); rctx.stroke();
        }
      }
      rctx.restore();
    });
  }
  // central photonic core
  const core=rctx.createRadialGradient(cx,cy,0,cx,cy,scale*0.13); core.addColorStop(0,'rgba(255,255,255,.97)'); core.addColorStop(.12,'rgba(195,255,246,.68)'); core.addColorStop(.30,'rgba(105,255,234,.24)'); core.addColorStop(.62,'rgba(125,200,255,.10)'); core.addColorStop(1,'rgba(0,0,0,0)');
  rctx.save(); rctx.globalCompositeOperation='lighter'; rctx.fillStyle=core; rctx.beginPath(); rctx.arc(cx,cy,scale*0.13,0,Math.PI*2); rctx.fill(); rctx.restore();
  // axial stem / photonic axis
  rctx.save(); rctx.globalCompositeOperation='screen';
  const lg=rctx.createLinearGradient(cx, cy-scale*0.5, cx, cy+scale*0.38); lg.addColorStop(0,'rgba(130,255,242,0)'); lg.addColorStop(.45,'rgba(120,255,235,.52)'); lg.addColorStop(.5,'rgba(255,255,255,.95)'); lg.addColorStop(1,'rgba(130,255,242,0)');
  rctx.strokeStyle=lg; rctx.lineWidth=2.3; rctx.shadowBlur=14+p.glow*7; rctx.shadowColor='rgba(100,255,240,.33)'; rctx.beginPath(); rctx.moveTo(cx, cy-scale*0.52); rctx.lineTo(cx, cy+scale*0.40); rctx.stroke();
  rctx.restore();
  const vign=rctx.createRadialGradient(cx,cy,scale*0.10,cx,cy,Math.max(w,h)*0.86); vign.addColorStop(0,'rgba(255,255,255,0)'); vign.addColorStop(1,'rgba(0,0,0,.58)'); rctx.fillStyle=vign; rctx.fillRect(0,0,w,h);
}
function drawMini(){
  const w=miniCanvas.width,h=miniCanvas.height; mctx.fillStyle='#091420'; mctx.fillRect(0,0,w,h);
  const N=Math.max(1,state.transfer.length), barW=(w-40)/N;
  const total = state.energies.reduce((a,b)=>a+b,0)||1;
  state.petals.forEach((pet,i)=>{ const x=20+i*barW, frac=(state.energies[i]||0)/total, hh=(h-30)*frac*3; const col=hsv((wavelengthBase(values().wavelengthBias)+i*7)%360,0.78,1); mctx.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},0.82)`; mctx.fillRect(x,h-14-hh,Math.max(4,barW-3),hh); });
  mctx.fillStyle='#dff8ff'; mctx.font='12px Segoe UI'; mctx.fillText('Выходные интенсивности / каналы', 10, 14);
}
function drawChart(){
  const w=chartCanvas.width,h=chartCanvas.height; cctx.fillStyle='#091521'; cctx.fillRect(0,0,w,h);
  cctx.strokeStyle='rgba(255,255,255,.08)'; for(let i=0;i<6;i++){ const y=20+(h-40)*i/5; cctx.beginPath(); cctx.moveTo(46,y); cctx.lineTo(w-10,y); cctx.stroke(); }
  const N=state.petals.length||1, maxE=Math.max(1e-6,...state.energies,1);
  state.petals.forEach((pet,i)=>{
    const x=55+(w-75)*i/Math.max(1,N-1), y=h-20-(h-50)*(state.energies[i]/maxE), col=hsv((wavelengthBase(values().wavelengthBias)+i*7)%360,0.75,1);
    cctx.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},0.88)`; cctx.fillRect(x-11,y,22,h-20-y); cctx.fillStyle='#dff6ff'; cctx.font='10px Segoe UI'; cctx.fillText(String(i+1),x-4,h-8);
  });
}
function updateTable(){
  const total=state.energies.reduce((a,b)=>a+b,0)||1;
  const rows=[['Канал','f0','Энергия','Вклад','Q']];
  state.petals.forEach((pet,i)=>rows.push([String(i+1), pet.f0.toFixed(2), (state.energies[i]||0).toFixed(3), (100*(state.energies[i]||0)/total).toFixed(1)+'%', pet.q.toFixed(2)]));
  $('tableOut').innerHTML=rows.flatMap(r=>r.map(v=>`<div>${v}</div>`)).join('');
}
function renderAll(){
  const p=values();
  const t = (p.animate && !state.frozen) ? performance.now()/1000 : state.renderTime;
  if(!state.frozen) state.renderTime=t;
  const phase = t*(0.18 + p.continuum*0.35);
  renderFlower(ctx, mainCanvas.width, mainCanvas.height, phase);
  drawMini(); drawChart(); updateTable();
  const res=state.result || {answer:'—',sumE:0,stability:0,mirror:0};
  $('bMode').textContent='Mode ' + p.solveMode;
  $('bAnswer').textContent='Answer ' + res.answer;
  $('bEnergy').textContent='Energy ' + (res.sumE||0).toFixed(3);
  $('bStable').textContent='Stability ' + ((res.stability||0)*100).toFixed(1)+'%';
  $('bMirror').textContent='Mirror ' + ((res.mirror||0)*100).toFixed(1)+'%';
  $('tag').textContent=`${state.uid || 'flower'} · ${p.solveMode} · step ${state.step}`;
  $('status').textContent = p.fullRest && state.frozen ? 'Режим полного покоя: расчёт завершён, дальнейшая активная работа остановлена.' : `Единый паттерн активен. Режим: ${p.solveMode}. Ответ: ${res.answer}`;
}
function loop(){
  if(state.running && state.mode==='passive'){
    computePassiveStep();
    if(state.step>=state.maxSteps){ state.running=false; if(values().fullRest) state.frozen=true; }
  }
  if(values().animate && !state.frozen || state.running) renderAll();
  requestAnimationFrame(loop);
}
async function renderBlob(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; const rc=c.getContext('2d',{alpha:false}); renderFlower(rc,w,h,state.renderTime); return await new Promise(resolve=>c.toBlob(resolve,'image/png')); }
function saveBlob(blob,name){ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),2500); }
function exportJSON(){ const blob=new Blob([JSON.stringify({uid:state.uid,seed:state.seed,params:values(),result:state.result,petals:state.petals,energies:state.energies},null,2)],{type:'application/json'}); saveBlob(blob,'CIC_Flower_v11_state.json'); }
function exportHTML(){ const blob=new Blob([document.documentElement.outerHTML],{type:'text/html'}); saveBlob(blob,'CIC_Flower_Ultimate_v11_snapshot.html'); }

$('solveMode').addEventListener('change', ()=>{ refreshModeBoxes(); if(values().autoRun) runSolve(); else renderAll(); });
$('preset').addEventListener('change', ()=>{ if($('preset').value!=='custom') applyPreset($('preset').value); if(values().autoRun) runSolve(); else renderAll(); });
RANGE_IDS.forEach(id=>$(id).addEventListener('input', ()=>{ updateOutputs(); if(values().autoRun) runSolve(); else renderAll(); }));
['px1','px2','px3','px4','pp1','pp2','pp3','pp4','arithA','arithB','arithOp','a11','a12','a21','a22','b1','b2','f1','f2','f3','f4','fa1','fa2','fa3','fa4','matrixProfile','wavelengthBias','fullRest','autoRun','animate','showVeins'].forEach(id=>$(id).addEventListener('input', ()=>{ if(values().autoRun) runSolve(); else renderAll(); }));
$('autoBtn').addEventListener('click', ()=>{ if($('preset').value!=='custom') applyPreset($('preset').value); runSolve(); });
$('newSeedBtn').addEventListener('click', ()=>{ newSeed(); runSolve(); });
$('runBtn').addEventListener('click', runSolve);
$('restBtn').addEventListener('click', stopRun);
$('pngPhoneBtn').addEventListener('click', async()=>saveBlob(await renderBlob(1206,2622),'CIC_Flower_v11_iPhone17.png'));
$('png4kBtn').addEventListener('click', async()=>saveBlob(await renderBlob(3840,2160),'CIC_Flower_v11_4K.png'));

updateOutputs(); refreshModeBoxes(); applyPreset('alpha'); newSeed(); buildPetals(); computePhotonic(); renderAll(); if(values().autoRun) runSolve(); requestAnimationFrame(loop);
